androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

#DEPENDENICES
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide"}
glidecompiler = {group = "com.github.bumptech.glide", name = "compiler", version.ref = "compiler"}
retrofit = {group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit"}
convertergson = {group = "com.squareup.retrofit2", name = "converter-gson",version.ref = "convertergson"}
recyclerview = {group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview"}
viewmodel = {group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref ="viewmodel"}
livedata = {group = "androidx.lifecycle", name = "lifecycle-livedata" , version.ref = "livedata"}
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
okhttp = {group = "com.squareup.okhttp3", name = "okhttp" , version.ref= "okhttp"}

appcompat = {group = "androidx.appcompat", name = "appcompat" , version.ref = "appcompat"}
material = { group = "com.google.android.material", name = "material", version.ref="material"}
constraintlayout = {group = "androidx.constraintlayout", name = "constraintlayout", version.ref="constraintlaout"}
swiperFresh = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout" , version.ref="swiperFresh"}
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraLifecycle" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraView" }
firebase-crashlytics-buildtools = { group = "com.google.firebase", name = "firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

